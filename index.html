<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mijn Garmin</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --border: rgba(11,11,11,0.12); --accent: #2a78d6; --critical: #d03b3b; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --border: rgba(255,255,255,0.14); --accent: #3987e5; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--ink); }
label.rem { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: var(--ink-2); }
button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--critical); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Mijn Garmin</h1>
  <p>Deze pagina is versleuteld. Vul je wachtwoord in.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Wachtwoord" autofocus required>
  <label class="rem"><input id="rem" type="checkbox" checked> Onthoud mij op dit apparaat</label>
  <button id="go">Openen</button>
  <div class="err" id="err" hidden>Verkeerd wachtwoord.</div>
</form>

const KEY = "garmin-dash-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function decryptWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      return await decryptWith(key);
    } catch { try { localStorage.removeItem(KEY); } catch {} }
  }
  const f = document.getElementById("f");
  f.hidden = false;
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.hidden = true;
    try {
      const key = await keyFromPassword(document.getElementById("pw").value);
      const raw = await crypto.subtle.exportKey("raw", key);
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
      if (document.getElementById("rem").checked) { try { localStorage.setItem(KEY, toB64(raw)); } catch {} }
      await decryptWith(key);
    } catch { err.hidden = false; go.disabled = false; }
  });
})();
</script>
