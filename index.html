<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mijn Garmin</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --border: rgba(11,11,11,0.12); --accent: #2a78d6; --critical: #d03b3b; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --border: rgba(255,255,255,0.14); --accent: #3987e5; }
}
/* Alleen voor het wachtwoordscherm; loader.js haalt de class weg zodra het dashboard start. */
body.locked { box-sizing: border-box; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.locked * { box-sizing: border-box; }
.locked form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
.locked h1 { font-size: 20px; margin: 0 0 4px; }
.locked p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
.locked input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--ink); }
.locked label.rem { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: var(--ink-2); }
.locked button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
.locked button:disabled { opacity: .6; }
.locked .err { color: var(--critical); font-size: 14px; margin-top: 12px; }
</style>
<script type="module" src="loader.js"></script>
</head>
<body class="locked">
<form id="f" hidden>
  <h1>Mijn Garmin</h1>
  <p>Deze pagina is versleuteld. Vul je wachtwoord in.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Wachtwoord" required>
  <label class="rem"><input id="rem" type="checkbox" checked> Onthoud mij op dit apparaat</label>
  <button id="go">Openen</button>
  <div class="err" id="err" hidden>Verkeerd wachtwoord.</div>
</form>
</body>
</html>
